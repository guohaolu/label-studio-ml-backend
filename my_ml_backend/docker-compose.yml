version: "3.8"

services:
  ml-backend:
    container_name: ml-backend
    image: humansignal/ml-backend:v0
    build:
      context: .
      args:
        TEST_ENV: ${TEST_ENV}
    environment:
      # specify these parameters if you want to use basic auth for the model server
      - BASIC_AUTH_USER=
      - BASIC_AUTH_PASS=
      # set the log level for the model server
      - LOG_LEVEL=DEBUG
      # any other parameters that you want to pass to the model server
      - ANY=PARAMETER
      # specify the number of workers and threads for the model server
      - WORKERS=1
      - THREADS=8
      # specify the model directory (likely you don't need to change this)
      - MODEL_DIR=/data/models

      # Specify the Label Studio URL and API key to access
      # uploaded, local storage and cloud storage files.
      # Do not use 'localhost' as it does not work within Docker containers.
      # Use prefix 'http://' or 'https://' for the URL always.
      # Determine the actual IP using 'ifconfig' (Linux/Mac) or 'ipconfig' (Windows).
      - LABEL_STUDIO_URL=
      - LABEL_STUDIO_API_KEY=
      # Doris（MySQL 协议，默认 FE 查询端口 9030）— 校验快递面单 expressNumber
      - DORIS_HOST=
      - DORIS_PORT=9030
      - DORIS_USER=
      - DORIS_PASSWORD=
      # 表在库内时填库名；或把 DORIS_EXPRESS_TABLE 设为 db.table
      - DORIS_DATABASE=
      - DORIS_EXPRESS_TABLE=furniture_tms_busi__express_detail
      # 买家昵称 buyerName 建 AC 词典；未设置时代码内默认 trade_order_line_s_o 表
      - DORIS_BUYER_NICKNAME_TABLE=furniture_trade__trade_order_line_s_o
      # 连接后默认 USE 的数据库（可选，与 DORIS_DATABASE 二选一或同时配置）
      - DORIS_SESSION_DATABASE=
      # 快递面单：全量拉 expressNumber 建 AC（秒）；0=每次 predict 都重拉（慎用）
      - EXPRESS_AC_REFRESH_SECS=600
      # 字典条数上限，0 表示不限制（数据量大时注意内存）
      - EXPRESS_AC_LOAD_LIMIT=0
      - EXPRESS_AC_MIN_LEN=8
      - EXPRESS_AC_MAX_LEN=64
    ports:
      - "9090:9090"
    volumes:
      - "./data/server:/data"
